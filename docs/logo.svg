<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16325C"/>
      <stop offset="1" stop-color="#0A1A33"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9FD3F0"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E63946"/>
      <stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- Faint rink lines -->
  <line x1="8" y1="128" x2="248" y2="128" stroke="#2E5A8C" stroke-width="3" opacity="0.5"/>
  <circle cx="128" cy="128" r="58" fill="none" stroke="#2E5A8C" stroke-width="3" opacity="0.5"/>

  <!-- Rising stat bars -->
  <rect x="58"  y="146" width="34" height="56"  rx="6" fill="url(#bar)"/>
  <rect x="111" y="112" width="34" height="90"  rx="6" fill="url(#bar)"/>
  <rect x="164" y="74"  width="34" height="128" rx="6" fill="url(#bar)"/>

  <!-- Hockey stick doubling as the trend line -->
  <path d="M 40 210 L 88 210 Q 98 210 104 202 L 214 58"
        fill="none" stroke="#0A1A33" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 40 210 L 88 210 Q 98 210 104 202 L 214 58"
        fill="none" stroke="url(#stick)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Puck -->
  <ellipse cx="200" cy="208" rx="24" ry="10" fill="#05101F"/>
  <rect x="176" y="196" width="48" height="12" fill="#05101F"/>
  <ellipse cx="200" cy="196" rx="24" ry="10" fill="#1E2A3A" stroke="#9FD3F0" stroke-width="2.5"/>
</svg>
